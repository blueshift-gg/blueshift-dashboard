name: Deploy
on:
  push:
    branches:
      - "master"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # https://github.com/actions/checkout/releases/tag/v7.0.0
        with:
          fetch-depth: 2

      - name: Install pnpm
        uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # https://github.com/pnpm/action-setup/releases/tag/v6.0.4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # https://github.com/actions/setup-node/releases/tag/v6.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Cache Next.js
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # https://github.com/actions/cache/releases/tag/v5.0.5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Cache Compiled MDX
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # https://github.com/actions/cache/releases/tag/v5.0.5
        with:
          path: ${{ github.workspace }}/.compiled-mdx
          key: ${{ runner.os }}-compiled-mdx-${{ hashFiles('src/app/content/**/*.mdx', 'src/lib/shiki/*.json') }}
          restore-keys: |
            ${{ runner.os }}-compiled-mdx-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm exec oxfmt --check .

      - name: Precompile MDX
        run: pnpm precompile-mdx

      - name: Upload Compiled MDX to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          COMPILED_DIR: .compiled-mdx
          CONTENT_PREFIX: compiled-mdx
        run: |
          CONTENT_PREFIX=${CONTENT_PREFIX:-compiled-mdx}
          S3_PREFIX="s3://${{ secrets.R2_BUCKET }}/$CONTENT_PREFIX"
          MANIFEST_NAME=".upload-manifest.json"
          MANIFEST_FILE="$COMPILED_DIR/$MANIFEST_NAME"
          REMOTE_MANIFEST_FILE="$RUNNER_TEMP/$MANIFEST_NAME"

          node ./scripts/mdx-upload-manifest.mjs write "$COMPILED_DIR" "$MANIFEST_FILE"

          aws s3 cp "$S3_PREFIX/$MANIFEST_NAME" "$REMOTE_MANIFEST_FILE" \
            --endpoint-url "$ENDPOINT" \
            --no-progress >/dev/null 2>&1 || printf '{}\n' > "$REMOTE_MANIFEST_FILE"

          # Size-only sync first (handles new files, size changes, and deletions efficiently)
          aws s3 sync "$COMPILED_DIR/" "$S3_PREFIX" \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --size-only \
            --delete \
            --content-type "application/json"

          # Manifest comparison catches same-size content edits without re-uploading every PR-touched file.
          changed_files=$(node ./scripts/mdx-upload-manifest.mjs diff "$MANIFEST_FILE" "$REMOTE_MANIFEST_FILE")

          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | while IFS= read -r json_path; do
              [ -n "$json_path" ] || continue

              aws s3 cp "$COMPILED_DIR/$json_path" "$S3_PREFIX/$json_path" \
                --endpoint-url "$ENDPOINT" \
                --no-progress \
                --content-type "application/json"
            done
          fi

          aws s3 cp "$MANIFEST_FILE" "$S3_PREFIX/$MANIFEST_NAME" \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --content-type "application/json"

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CHALLENGE_SECRET: ${{ secrets.NEXT_PUBLIC_CHALLENGE_SECRET }}
          NEXT_PUBLIC_CHALLENGE_RPC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CHALLENGE_RPC_ENDPOINT }}
          NEXT_PUBLIC_MAINNET_RPC_ENDPOINT: ${{ secrets.NEXT_PUBLIC_MAINNET_RPC_ENDPOINT }}
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # https://github.com/cloudflare/wrangler-action/releases/tag/v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
