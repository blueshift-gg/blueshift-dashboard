  "@aws-sdk/xml-builder>fast-xml-parser": ">=5.7.0 <6"
  "@tailwindcss/typography>postcss-selector-parser": ">=6.1.5 <7"
  oxfmt>tinypool: ">=2.1.2 <3"
  monaco-editor>dompurify: ">=3.4.17 <4"
  "@anchor-lang/core>toml": ">=5.0.1 <6"
